    <style>
        :root {
            --accent: #d51b55;
            --accent-glow: rgba(213, 27, 85, 0.4);
            --bg-dark: #0a0a0b;
            --glass: rgba(15, 15, 18, 0.88);
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

        /* Full-size iframe */
        .player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── Floating Server Button (left-center, vertical pill) ── */
        .fab-wrap {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 38px;
        }

        .fab-wrap.hidden {
            transform: translateY(-50%) translateX(-34px);
            opacity: 0.5;
        }

        .fab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 0 10px 10px 0;
            padding: 16px 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
            box-shadow: 3px 0 20px rgba(213,27,85,0.5);
            transition: all 0.2s;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            min-height: 80px;
            width: 100%;
        }

        @media (hover: hover) {
            .fab-wrap.hidden:hover {
                transform: translateY(-50%) translateX(0);
                opacity: 1;
            }

            .fab-btn:hover {
                padding-left: 14px;
                box-shadow: 4px 0 24px rgba(213,27,85,0.7);
            }
        }

        .fab-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            margin-bottom: 4px;
            animation: blink 1.8s ease-in-out infinite;
            display: block;
            writing-mode: horizontal-tb;
            align-self: center;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ── Backdrop ── */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
        }

        .backdrop.open { display: block; }

        /* ── Server Popup Panel ── */
        .server-popup {
            position: fixed;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px 16px 0 0;
            padding: 16px 14px 20px;
            width: min(360px, 96vw);
            transition: bottom 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -8px 40px rgba(0,0,0,0.7);
        }

        .server-popup.open {
            bottom: 0;
        }

        .popup-handle {
            width: 36px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 0 auto 14px;
        }

        .popup-title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            text-align: center;
            margin-bottom: 12px;
        }

        .popup-servers {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .srv-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s;
        }

        .srv-btn:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.06);
        }

        .srv-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 3px 12px var(--accent-glow);
        }

        .srv-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .srv-btn.active .srv-dot { opacity: 1; }

        /* Loading Screen */
        .loader-container {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .loader-ring {
            position: relative;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.05);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 2px solid rgba(255,255,255,0.05);
            border-bottom: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            margin-top: 20px;
            color: var(--text);
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.8;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .refresh-link {
            margin-top: 15px;
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            border: 1px solid var(--accent);
            padding: 8px 20px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .refresh-link:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>

    
        <!-- Backdrop (closes popup on tap outside) -->
        <div class="backdrop" id="backdrop" onclick="closePopup()"></div>

        <!-- Bottom Sheet Popup -->
        <div class="server-popup" id="serverPopup">
            <div class="popup-handle"></div>
            <div class="popup-title">Select Server</div>
            <div class="popup-servers">
                                        <button class="srv-btn active"
                                onclick="changeServer('https://abyssplayer.com/x-UxcyUVs', this)">
                            <span class="srv-dot"></span>
                            Server 3                        </button>
                                                                                                                                </div>
        </div>

        <div class="player-wrapper">
            <!-- Left-side floating server button -->
            <div class="fab-wrap">
                <button class="fab-btn" id="fabBtn" onclick="openPopup()">
                    <span class="fab-dot"></span>
                    SERVER
                </button>
            </div>

            <iframe
                id="videoFrame"
                allowfullscreen
                allow="autoplay; encrypted-media"
                src="https://abyssplayer.com/x-UxcyUVs"></iframe>
        </div>

    
    <script>
        let fabTimer;
        const fabWrap = document.querySelector('.fab-wrap');

        function showFab() {
            if (!fabWrap) return;
            fabWrap.classList.remove('hidden');
            clearTimeout(fabTimer);
            fabTimer = setTimeout(hideFab, 1000);
        }

        function hideFab() {
            if (!fabWrap) return;
            fabWrap.classList.add('hidden');
        }

        // Show on interaction
        document.addEventListener('mousemove', showFab);
        document.addEventListener('touchstart', showFab);
        
        // Initial timer
        fabTimer = setTimeout(hideFab, 500);

        function openPopup() {
            document.getElementById('serverPopup').classList.add('open');
            document.getElementById('backdrop').classList.add('open');
            clearTimeout(fabTimer); // Don't hide while popup is open
        }

        function closePopup() {
            document.getElementById('serverPopup').classList.remove('open');
            document.getElementById('backdrop').classList.remove('open');
            showFab(); // Restart timer
        }

        function changeServer(url, el) {
            document.getElementById('videoFrame').src = url;
            document.querySelectorAll('.srv-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            setTimeout(closePopup, 500);
        }
    </script>
</body>
</html>
