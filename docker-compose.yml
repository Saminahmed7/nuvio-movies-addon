version: '3.8'

services:
  nuvio-movies-addon:
    build: .
    container_name: nuvio-movies-addon
    ports:
      - "7001:7001"
    environment:
      - PORT=7001
      - LOG_LEVEL=INFO
      - CACHE_TTL_SEARCH=3600
      - CACHE_TTL_CATALOG=86400
      - STREAM_DEADLINE_S=9.5
      - RATE_LIMIT_VIDLOVE=30
      - RATE_LIMIT_VIDROCK=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:7001/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Run with nginx reverse proxy for SSL termination
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - nuvio-movies-addon